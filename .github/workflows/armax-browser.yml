name: Verify Armax browser

on:
  pull_request:
    paths:
      - 'src/armax-*'
      - 'src/main.js'
      - 'src/gamepad-controls.js'
      - 'tests/gamepad-controls.test.js'
      - 'src/style.css'
      - 'public/assets/armax/lot22/**'
      - 'scripts/armax-browser.mjs'
      - 'package*'
      - 'vite.config.js'
      - '.github/workflows/armax-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise Armax controls in Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/armax
          PLAYWRIGHT_EXECUTABLE_PATH="$(node --input-type=module -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath());')"
          export PLAYWRIGHT_EXECUTABLE_PATH
          test -x "$PLAYWRIGHT_EXECUTABLE_PATH"

          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const paths = [
            '.github/workflows/armax-browser.yml',
            'scripts/armax-browser.mjs',
            'src/main.js',
            'src/gamepad-controls.js',
            'tests/gamepad-controls.test.js',
            'src/armax-data.js',
            'src/armax-expansion-data.js',
            'src/armax-engine.js',
            'src/armax-campaign.js',
            'src/armax-ui.js',
            'src/armax-ui.css',
            'tests/armax-engine.test.js',
            'tests/armax-expansion.test.js',
          ];
          const sourceSha256 = Object.fromEntries(await Promise.all(paths.map(async path => [
            path, createHash('sha256').update(await readFile(path)).digest('hex'),
          ])));
          const provenance = {
            at: new Date().toISOString(),
            sourceHead: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            runId: process.env.GITHUB_RUN_ID,
            sourceSha256,
            node: process.version,
            playwright: JSON.parse(await readFile('node_modules/playwright/package.json', 'utf8')).version,
            browserExecutable: process.env.PLAYWRIGHT_EXECUTABLE_PATH,
            buildKind: 'vite-development',
            scope: 'Actual Armax DOM controls and Three.js in headless Chromium; no full-kit, hardware or artistic-fidelity certification.',
          };
          await writeFile('test-results/armax/provenance.json', JSON.stringify(provenance, null, 2) + '\n');
          NODE

          ARMAX_SELF_HOST=1 GAME_URL=http://127.0.0.1:4187/ ARMAX_QA_DIR=test-results/armax \
            node scripts/armax-browser.mjs 2>&1 | tee test-results/armax/armax-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relay-Chronicles-Armax-Browser
          path: test-results/armax/
          if-no-files-found: warn
          retention-days: 30
